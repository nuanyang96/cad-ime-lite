# CadImeLite v6 规则文件（UTF-8）
# ---------------------------------------------------------------
# scope = 只处理这些进程，逗号分隔；其他应用一律不碰
scope=acad

# ---------------------------------------------------------------
# v6 通道选择（这次新增）
#   auto  = 先试 tsf（配了 tsf_guid 且能读回值）→ 再试 imm32（能读回才算有效）
#           → 都不行就发一次 Shift
#   imm32 = 强制 IMM32 通道（主机上的微软拼音）
#   shift = 强制合成 Shift（微信输入法 / 搜狗这类纯 TSF 输入法）
#   tsf   = 强制 TSF 通道（必须配 tsf_guid）
#
# 实测记录（2026-10-28，虚拟机）：
#   微软拼音：IMM32 有效（0x0001 <-> 0x0000）
#   微信输入法 3.0.1.12 / 搜狗 16.9：IMM32 调用返回 OK 但状态不动，
#       读回恒为 0x0000；它们的 compartment 在外部进程读不到值（S_FALSE），
#       所以这两家只能走 shift。
channel=auto

# 只有确认某个输入法在外部进程能读到/写得了 compartment 时，才填这一行。
# 留空（默认）就不走 TSF。
# tsf_guid={00000000-0000-0000-0000-000000000000}
tsf_guid=

# ---------------------------------------------------------------
# 类名前缀规则：类名以某前缀开头（末尾的 * 是标记），优先级低于绘图区判据
# CAD 2024 的命令行是 WPF 窗口，类名 HwndWrapper[DefaultDomain;;<GUID>]
# GUID 每次启动都变，只能按前缀认。优先级：绘图区 > 前缀 > 类名表
HwndWrapper[DefaultDomain*=0

# 类名 -> 1=中文  0=英文
# 注意：绘图区判据优先级最高（父链含 MDIClient 一律英文），改这里压不过它。
# Edit=0 只管命令行那类普通编辑框，所以有效。

# AutoCAD 命令行
AcCommandLine=0
Edit=0
# AutoCAD 文字编辑器（在位编辑）类名，留着备用；真在绘图区里时由绘图区判据接管
AcMTextEditor=1
AcDTextEditor=1
AcTextEd=1
# 通用编辑控件
AfxEditCtrl=1
AfxRichEdit=1
RichEdit20W=1
RichEdit50W=1
RichEdit20A=1
RICHEDIT=1


